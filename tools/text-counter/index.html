<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テキスト文字数カウンター</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <span class="eyebrow">文字数チェック</span>
            <h1>テキスト文字数カウンター</h1>
            <p>入力したテキストの文字数をリアルタイムで確認できます。</p>
        </header>

        <div class="card">
            <section class="input-area">
                <div class="input-label-row">
                    <label for="textInput">テキスト</label>
                    <span class="file-drop-status" id="fileDropStatus" role="status">テキストファイルをドロップできます</span>
                </div>
                <textarea id="textInput" aria-describedby="fileDropStatus" placeholder="ここにテキストを入力、またはファイルをドロップしてください..."></textarea>
                <div class="input-actions">
                    <button class="ghost-button" id="clearButton" type="button">クリア</button>
                </div>
            </section>

            <section class="stats">
                <div class="stat">
                    <span class="label">文字数</span>
                    <span class="value" id="charCount">0</span>
                </div>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
